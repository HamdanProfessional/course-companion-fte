# Nginx config for MCP SSE Server
# Place at: /etc/nginx/sites-available/mcp-sse

server {
    listen 443 ssl http2;
    server_name sse.testservers.online;

    # SSL certificates (from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sse.testservers.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sse.testservers.online/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SSE endpoint - CRITICAL: No buffering for SSE!
    location /mcp {
        proxy_pass http://localhost:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # Headers for SSE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }

    # Messages endpoint (POST from ChatGPT)
    location /messages {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root endpoint
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sse.testservers.online;
    return 301 https://$server_name$request_uri;
}
